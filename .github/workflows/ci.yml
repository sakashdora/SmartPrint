name: SmartPrint checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  # The same suite against a real, disposable PostgreSQL. The default `npm test` run uses SQLite, which
  # serialises every query and therefore cannot prove row-lock or constraint behaviour.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartprint
          POSTGRES_PASSWORD: smartprint_ci
          POSTGRES_DB: smartprint_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smartprint -d smartprint_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SMARTPRINT_TEST_DATABASE_URL: postgresql://smartprint:smartprint_ci@localhost:5432/smartprint_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: PostgreSQL tests
        run: |
          set +e
          node --test --test-concurrency=1 test/postgres-integration.test.js test/phase3-agents.test.js > pg-tests.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # Job logs need a sign-in to read; an annotation does not. Put the failure details there.
            node -e "const t=require('fs').readFileSync('pg-tests.log','utf8').split('\n');const keep=[];for(let i=0;i<t.length;i++){if(/✖|error:|message:|code:|Error|expected|actual|at .*test.*:\d+/.test(t[i]))keep.push(t[i].trim().slice(0,220))}console.log('::error title=PostgreSQL test failures::'+keep.slice(0,40).join('%0A'))"
          fi
          exit $code

  # Fails the build if a credential-looking value is committed.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
